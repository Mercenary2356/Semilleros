<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/sylesresgister.css">
</head>
<body>
    <a href="index.html" class="btn-inicio">Inicio</a>
    <div class="register-container">
        <h2>Registro</h2>
        <form id="registerForm">
            <div class="input-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="Ingresa tu correo" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Crea una contraseña" required>
            </div>
            <div class="input-group">
                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required>
            </div>
            <button type="submit" class="btn">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nombre = document.getElementById('name').value;
            const correo = document.getElementById('email').value;
            const contraseña = document.getElementById('password').value;
            const confirmar_contraseña = document.getElementById('confirm-password').value;

            if (contraseña !== confirmar_contraseña) {
                alert("Las contraseñas no coinciden.");
                return;
            }

            const response = await fetch('/registro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ nombre, correo, contraseña, confirmar_contraseña }),
            });

            const data = await response.text();
            if (response.ok) {
                alert(data);
                window.location.href = "login.html"; // Redirige al login
            } else {
                alert(data);
            }
        });
    </script>
</body>
</html>
